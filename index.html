<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech to Text Pad</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🎤Speech to Text Pad</h1>

        <div class="controls">
            <button id="start-btn">Start Listening</button>
            <button id="stop-btn">Stop Listening</button>
        </div>

        <textarea id="text-area" placeholder="Speak and text will appear here..."></textarea>

        <button id="save-btn">Save Note</button>

        <div class="notes-section">
            <h2>Saved Notes</h2>
            <ul id="notes-list"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
